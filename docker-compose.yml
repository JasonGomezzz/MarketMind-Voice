version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: marketmind_postgres
    environment:
      POSTGRES_DB: marketmind_db
      POSTGRES_USER: marketmind_user
      POSTGRES_PASSWORD: localpass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketmind_user -d marketmind_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketmind_net
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: marketmind_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - marketmind_net
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.45.1
    container_name: marketmind_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=localpass123
      - N8N_ENCRYPTION_KEY=dev-encryption-key-cambiar-en-prod
      - GENERIC_TIMEZONE=America/Lima
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - marketmind_net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  n8n_data:

networks:
  marketmind_net:
    driver: bridge