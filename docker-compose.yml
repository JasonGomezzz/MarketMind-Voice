services:

  postgres:
    image: postgres:16-alpine
    container_name: marketmind_postgres
    environment:
      POSTGRES_DB: marketmind_db
      POSTGRES_USER: marketmind_user
      POSTGRES_PASSWORD: localpass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketmind_user -d marketmind_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketmind_net
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: marketmind_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - marketmind_net
    restart: unless-stopped

  n8n:
    build:
      context: ./n8n
      dockerfile: Dockerfile
    container_name: marketmind_n8n
    env_file:
      - ./backend/.env
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=localpass123
      - N8N_ENCRYPTION_KEY=dev-encryption-key-cambiar-en-prod
      - GENERIC_TIMEZONE=America/Lima
      - NO_PROXY=*
      - no_proxy=*
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_WORKFLOW_ID=QAkaxptDCI9ahjQU
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - marketmind_net
    restart: unless-stopped

  springboot:
    build:
      context: ./springboot
      dockerfile: Dockerfile
    container_name: marketmind_springboot
    ports:
      - "${SPRINGBOOT_HOST_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-marketmind_db}
      - DB_USER=${DB_USER:-marketmind_user}
      - DB_PASSWORD=${DB_PASSWORD:-localpass123}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key-marketmind-2026-local}
      - INTERNAL_EVENT_TOKEN=${INTERNAL_EVENT_TOKEN:-dev-internal-event-token}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - marketmind_net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  n8n_data:

networks:
  marketmind_net:
    driver: bridge
