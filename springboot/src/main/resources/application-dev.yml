spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:marketmind_db}
    username: ${DB_USER:marketmind_user}
    password: ${DB_PASSWORD:localpass123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false

app:
  jwt:
    secret: ${SECRET_KEY:django-insecure-dev-key-marketmind-2026-local}

logging:
  level:
    com.marketmind: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
