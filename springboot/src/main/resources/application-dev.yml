spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:marketmind_db}
    username: ${DB_USER:marketmind_user}
    password: ${DB_PASSWORD:localpass123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false

app:
  jwt:
    secret: ${SECRET_KEY:django-insecure-dev-key-marketmind-2026-local}
  internal:
    event-token: ${INTERNAL_EVENT_TOKEN:dev-internal-event-token}

# HU17 — n8n webhook para notificación de email al marketero.
# host.docker.internal apunta al host Mac desde el container Spring Boot;
# si Spring Boot corre fuera de Docker, sobrescribir a http://localhost:5678.
n8n:
  webhook-url: ${N8N_WEBHOOK_URL:http://host.docker.internal:5678}

logging:
  level:
    com.marketmind: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
