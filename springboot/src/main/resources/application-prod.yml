spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require&channel_binding=disable&connectTimeout=15
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false

app:
  django:
    internal-url: ${DJANGO_INTERNAL_URL}
  jwt:
    secret: ${SECRET_KEY}
  # Sin valor por defecto en producción: el aviso interno debe usar un secreto propio.
  internal:
    event-token: ${INTERNAL_EVENT_TOKEN}

# HU17 — n8n webhook (Railway URL en prod).
n8n:
  webhook-url: ${N8N_WEBHOOK_URL}

logging:
  level:
    com.marketmind: INFO
    root: WARN
